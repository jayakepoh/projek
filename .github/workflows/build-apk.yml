name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main, master, os-tv-android]
    tags: ["v*"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Setup Gradle wrapper (generate jika belum ada)
        working-directory: android-tv
        run: gradle wrapper --gradle-version 8.9 --no-daemon || true

      - name: Build debug APK
        working-directory: android-tv
        run: gradle assembleDebug --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: os-tv-android-debug-apk
          path: android-tv/app/build/outputs/apk/debug/*.apk

      - name: Attach APK to GitHub Release (only on tag push)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: android-tv/app/build/outputs/apk/debug/*.apk
